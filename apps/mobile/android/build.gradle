// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// RN 0.81 + nouvelle arch : `std::format` (graphicsConversions.h) exige une libc++ récente — NDK 26 ne l’expose pas.
// NDK r27+ supprime le linker « gold » ; si CMake échoue avec -fuse-ld=gold, voir release notes NDK / AGP.
// Doit être défini avant expo-root-project pour que `setIfNotExist("ndkVersion")` conserve cette valeur.
ext {
  ndkVersion = "27.1.12297006"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
