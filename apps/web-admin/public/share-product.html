<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Produit A2Express</title>
  <meta name="description" content="Ouvre ou installe A2Express pour voir ce produit." />
  <meta property="og:title" content="Produit A2Express" />
  <meta property="og:description" content="Ouvre ou installe A2Express pour voir ce produit." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#FF6A00" />
  <style>
    :root {
      --orange: #FF6A00;
      --orange-dark: #E55A00;
      --bg: #FFFAF5;
      --text: #1A202C;
      --muted: #718096;
      --card: #FFFFFF;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--orange);
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand strong { font-size: 18px; }
    .brand span { color: var(--muted); font-size: 13px; display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(255, 106, 0, 0.08);
    }
    .photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #FAFAFA;
      display: none;
    }
    .photo.show { display: block; }
    .body { padding: 18px; }
    .shop { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    h1 { font-size: 20px; line-height: 1.3; margin: 0 0 8px; }
    .price { font-size: 18px; font-weight: 800; color: var(--orange); margin: 0 0 12px; }
    .hint {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0 0 16px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:active { background: var(--orange-dark); }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .stores { display: flex; gap: 8px; }
    .stores .btn { flex: 1; font-size: 13px; padding: 12px 8px; }
    .status { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 18px; }
    .foot { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">A2</div>
      <div>
        <strong>A2Express</strong>
        <span>Marketplace B2B</span>
      </div>
    </div>
    <div class="card">
      <img id="photo" class="photo" alt="" />
      <div class="body">
        <p id="shop" class="shop"></p>
        <h1 id="title">Produit A2Express</h1>
        <p id="price" class="price" hidden></p>
        <p class="hint" id="hint">
          Ce produit a été partagé avec vous. Ouvrez-le dans A2Express, ou installez l’application si vous ne l’avez pas encore.
        </p>
        <button class="btn btn-primary" id="openBtn" type="button">Ouvrir dans A2Express</button>
        <div class="stores">
          <a class="btn btn-secondary" id="playBtn" href="https://play.google.com/store/apps/details?id=com.askia1.assmaexpress">Installer sur Android</a>
          <a class="btn btn-secondary" id="iosBtn" href="https://apps.apple.com/search?term=A2Express">Installer sur iPhone</a>
        </div>
        <p class="status" id="status"></p>
      </div>
    </div>
    <p class="foot">Après l’installation, revenez sur cette page et touchez « Ouvrir dans A2Express ».</p>
  </div>
  <script>
    (function () {
      var PROJECT = "assma-expresse";
      var API_KEY = "AIzaSyDRl3TmG0xLlkSXCEEaFsgQ8m97wcT0xi0";
      var PLAY = "https://play.google.com/store/apps/details?id=com.askia1.assmaexpress";
      var IOS_SEARCH = "https://apps.apple.com/search?term=A2Express";
      var PACKAGE = "com.askia1.assmaexpress";

      var params = new URLSearchParams(location.search);
      var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
      var wholesale = params.get("w") === "1" || parts[1] === "wholesale";
      var id = wholesale && parts[1] === "wholesale" ? parts[2] : parts[1];
      id = decodeURIComponent(id || "").trim();

      var titleEl = document.getElementById("title");
      var priceEl = document.getElementById("price");
      var shopEl = document.getElementById("shop");
      var photoEl = document.getElementById("photo");
      var statusEl = document.getElementById("status");
      var openBtn = document.getElementById("openBtn");
      var playBtn = document.getElementById("playBtn");
      var iosBtn = document.getElementById("iosBtn");

      var qName = (params.get("n") || "").trim();
      var qPrice = (params.get("pr") || "").trim();
      if (qName) titleEl.textContent = qName;
      if (qPrice) {
        priceEl.hidden = false;
        priceEl.textContent = qPrice;
      }

      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      if (isAndroid) iosBtn.style.display = "none";
      if (isIOS) playBtn.style.display = "none";

      function strField(fields, key) {
        var f = fields && fields[key];
        if (!f) return "";
        return f.stringValue || "";
      }
      function numField(fields, key) {
        var f = fields && fields[key];
        if (!f) return null;
        if (f.integerValue != null) return Number(f.integerValue);
        if (f.doubleValue != null) return Number(f.doubleValue);
        return null;
      }
      function firstImage(fields) {
        var main = strField(fields, "mainImage") || strField(fields, "imageUrl") || strField(fields, "image");
        if (main) return main;
        var arr = fields && fields.images && fields.images.arrayValue && fields.images.arrayValue.values;
        if (arr && arr[0] && arr[0].stringValue) return arr[0].stringValue;
        return "";
      }

      function deepLink() {
        return wholesale
          ? "assmaexpress://product/wholesale/" + encodeURIComponent(id)
          : "assmaexpress://product/" + encodeURIComponent(id);
      }

      function androidIntent() {
        var path = wholesale ? "product/wholesale/" + encodeURIComponent(id) : "product/" + encodeURIComponent(id);
        return (
          "intent://" + path +
          "#Intent;scheme=assmaexpress;package=" + PACKAGE +
          ";S.browser_fallback_url=" + encodeURIComponent(PLAY) +
          ";end"
        );
      }

      function openApp() {
        if (!id) {
          statusEl.textContent = "Lien incomplet. Installez A2Express puis cherchez le produit.";
          return;
        }
        statusEl.textContent = "Ouverture de l’application…";
        if (isAndroid) {
          window.location.href = androidIntent();
          return;
        }
        var hidden = false;
        function onHide() { hidden = true; }
        document.addEventListener("visibilitychange", onHide, { once: true });
        window.location.href = deepLink();
        setTimeout(function () {
          if (!hidden && !document.hidden) {
            statusEl.textContent = "Application introuvable. Installez A2Express, puis revenez toucher « Ouvrir ».";
            if (isIOS) window.location.href = IOS_SEARCH;
          }
        }, 1800);
      }

      openBtn.addEventListener("click", openApp);
      playBtn.href = PLAY;
      iosBtn.href = IOS_SEARCH;

      if (!id) {
        statusEl.textContent = "Aucun produit dans ce lien.";
        openBtn.disabled = true;
        return;
      }

      var url =
        "https://firestore.googleapis.com/v1/projects/" + PROJECT +
        "/databases/(default)/documents/products/" + encodeURIComponent(id) +
        "?key=" + encodeURIComponent(API_KEY);

      fetch(url)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (doc) {
          if (!doc || !doc.fields) return;
          var fields = doc.fields;
          var name = strField(fields, "name") || qName;
          if (name) titleEl.textContent = name;
          var shop = strField(fields, "companyName") || strField(fields, "supplier");
          if (shop) shopEl.textContent = shop;
          if (!qPrice) {
            var n = numField(fields, "price");
            if (n != null && !isNaN(n)) {
              priceEl.hidden = false;
              priceEl.textContent = Math.round(n).toLocaleString("fr-FR") + " CFA";
            }
          }
          var img = firstImage(fields);
          if (img) {
            photoEl.src = img;
            photoEl.alt = name || "Produit";
            photoEl.classList.add("show");
          }
          document.title = (name || "Produit") + " · A2Express";
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
