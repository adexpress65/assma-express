version: "3.9"
services:
  postgres:
    image: postgres:14
    container_name: assma-db
    restart: always
    environment:
      POSTGRES_USER: assma
      POSTGRES_PASSWORD: assma
      POSTGRES_DB: assma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
